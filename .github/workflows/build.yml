name: Build Windows exe

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name PhotoSplitter --paths src src/app.py

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSplitter-exe
          path: dist/PhotoSplitter.exe
